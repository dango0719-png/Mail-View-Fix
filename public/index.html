<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mail Viewer</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    .top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .brand{font-size:20px;font-weight:700}
    .status{font-size:13px;color:#64748b}
    .wrap{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:24px}
    .login{width:390px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:28px;box-shadow:0 10px 30px #0000000b}
    h1{margin:0 0 8px;font-size:24px}
    .muted{color:#64748b;font-size:14px;margin-bottom:22px}
    label{display:block;font-size:13px;font-weight:600;margin:14px 0 7px}
    input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
    button{border:0;border-radius:8px;padding:11px 16px;background:#2563eb;color:#fff;cursor:pointer;font-weight:600}
    button:disabled{opacity:.6;cursor:wait}
    .login button{width:100%;margin-top:20px}
    .error{display:none;background:#fee2e2;color:#991b1b;padding:11px;border-radius:8px;font-size:13px;margin-top:15px}
    .app{display:none;height:calc(100vh - 64px)}
    .sidebar{width:360px;background:#fff;border-right:1px solid #e5e7eb;overflow:auto}
    .toolbar{padding:14px;border-bottom:1px solid #e5e7eb;display:flex;gap:8px}
    .toolbar button{width:auto}
    .secondary{background:#e2e8f0;color:#172033}
    .mail{padding:13px 16px;border-bottom:1px solid #eef2f7;cursor:pointer}
    .mail:hover{background:#f8fafc}
    .mail .subject{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mail .from,.mail .date{font-size:12px;color:#64748b;margin-top:5px}
    .content{flex:1;background:#fff;overflow:auto;padding:30px}
    .content h2{margin-top:0}
    .content iframe{width:100%;min-height:70vh;border:0}
    .empty{color:#64748b;text-align:center;margin-top:35px}
    @media(max-width:700px){.sidebar{width:100%}.content{display:none}.app{display:block}.app.mobile-detail .sidebar{display:none}.app.mobile-detail .content{display:block}}
  </style>
</head>
<body>
<header class="top">
  <div class="brand">📬 Mail Viewer</div>
  <div id="topStatus" class="status">Chưa đăng nhập</div>
</header>

<div id="loginWrap" class="wrap">
  <form id="loginForm" class="login">
    <h1>Đăng nhập email</h1>
    <div class="muted">Nhập tài khoản email của khách hàng để xem hộp thư.</div>

    <label>Email</label>
    <input id="user" type="email" autocomplete="username" required placeholder="you@example.com">

    <label>Mật khẩu</label>
    <input id="pass" type="password" autocomplete="current-password" required placeholder="••••••••">

    <div style="font-size:12px;color:#64748b;margin-top:12px">
      Máy chủ thư: <b id="imapHost">m4.kcn.ne.jp</b>
    </div>

    <button id="loginBtn" type="submit">Đăng nhập</button>
    <div id="loginError" class="error"></div>
  </form>
</div>

<div id="app" class="app">
  <aside class="sidebar">
    <div class="toolbar">
      <button id="refreshBtn">↻ Làm mới</button>
      <button id="logoutBtn" class="secondary">Đăng xuất</button>
    </div>
    <div id="mailList"></div>
  </aside>
  <main class="content">
    <div id="mailContent" class="empty">Chọn một email để xem nội dung</div>
  </main>
</div>

<script>
let token = sessionStorage.getItem('mail_token');

const $ = id => document.getElementById(id);
const api = async (url, options = {}) => {
  const headers = {'Content-Type':'application/json', ...(options.headers || {})};
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(url, {...options, headers});
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); }
  catch { throw new Error('Máy chủ trả về dữ liệu không hợp lệ (' + r.status + ').'); }
  if (!r.ok) {
    if (r.status === 401) logout(false);
    throw new Error(data.error || 'Có lỗi xảy ra.');
  }
  return data;
};

function showLogin() {
  $('loginWrap').style.display = 'flex';
  $('app').style.display = 'none';
  $('topStatus').textContent = 'Chưa đăng nhập';
}

function showApp(user) {
  $('loginWrap').style.display = 'none';
  $('app').style.display = 'flex';
  $('topStatus').textContent = '● ' + user;
}

function logout(clearServer = true) {
  if (clearServer && token) fetch('/api/logout', {
    method:'POST',
    headers:{Authorization:'Bearer '+token}
  }).catch(()=>{});
  token = null;
  sessionStorage.removeItem('mail_token');
  $('mailList').innerHTML = '';
  $('mailContent').innerHTML = '<div class="empty">Chọn một email để xem nội dung</div>';
  showLogin();
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('loginBtn');
  const err = $('loginError');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Đang kiểm tra...';

  try {
    const data = await api('/api/login', {
      method:'POST',
      body:JSON.stringify({user:$('user').value, pass:$('pass').value})
    });
    token = data.token;
    sessionStorage.setItem('mail_token', token);
    $('pass').value = '';
    showApp(data.user);
    await loadMails();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }
});

async function loadMails() {
  $('mailList').innerHTML = '<div class="empty">Đang tải email...</div>';
  try {
    const mails = await api('/api/mails');
    if (!mails.length) {
      $('mailList').innerHTML = '<div class="empty">Hộp thư trống</div>';
      return;
    }
    $('mailList').innerHTML = mails.map(m => `
      <div class="mail" data-id="${m.id}">
        <div class="subject">${escapeHtml(m.subject)}</div>
        <div class="from">${escapeHtml(m.from)}</div>
        <div class="date">${m.date ? new Date(m.date).toLocaleString('vi-VN') : ''}</div>
      </div>
    `).join('');
    document.querySelectorAll('.mail').forEach(el => {
      el.addEventListener('click', () => openMail(el.dataset.id));
    });
  } catch (e) {
    $('mailList').innerHTML = '<div class="error" style="display:block;margin:12px">' + escapeHtml(e.message) + '</div>';
  }
}

async function openMail(id) {
  $('mailContent').innerHTML = '<div class="empty">Đang tải...</div>';
  try {
    const m = await api('/api/mails/' + encodeURIComponent(id));
    $('mailContent').innerHTML = `
      <button class="secondary" onclick="document.getElementById('app').classList.remove('mobile-detail')" style="margin-bottom:15px">← Danh sách</button>
      <h2>${escapeHtml(m.subject)}</h2>
      <div style="font-size:13px;color:#64748b;margin-bottom:20px">${escapeHtml(m.from || '')}</div>
      <iframe sandbox="allow-same-origin" id="mailFrame"></iframe>
    `;
    const frame = $('mailFrame');
    frame.srcdoc = m.body;
    $('app').classList.add('mobile-detail');
  } catch (e) {
    $('mailContent').innerHTML = '<div class="error" style="display:block">' + escapeHtml(e.message) + '</div>';
  }
}

function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

$('refreshBtn').onclick = loadMails;
$('logoutBtn').onclick = () => logout(true);

(async function init() {
  if (!token) return showLogin();
  try {
    const me = await api('/api/me');
    showApp(me.user);
    await loadMails();
  } catch (_) {
    showLogin();
  }
})();
</script>
</body>
</html>
